<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Folio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <!-- Static loading screen — replaced once React mounts -->
      <style>
        #app-loader{display:flex;align-items:center;justify-content:center;height:100dvh;background:#f8f9fb}
        @media(prefers-color-scheme:dark){#app-loader{background:#0a0a0f}}
        #app-loader .spinner{width:28px;height:28px;border:3px solid #d1d5db;border-top-color:#4a6cf7;border-radius:50%;animation:spin .6s linear infinite}
        @media(prefers-color-scheme:dark){#app-loader .spinner{border-color:#374151;border-top-color:#6d8afb}}
        @keyframes spin{to{transform:rotate(360deg)}}
      </style>
      <div id="app-loader"><div class="spinner"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
